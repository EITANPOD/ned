language: en-US

reviews:
  profile: chill
  auto_review:
    enabled: true
    drafts: false
  high_level_summary: true
  poem: false
  path_instructions:
    - path: "infra/**"
      instructions: "Terraform: check least-privilege IAM (resource-scoped, no Action:*), ned- naming, no secrets in code, tests assert real behavior."
    - path: ".github/workflows/**"
      instructions: "GitHub Actions: third-party actions pinned to a full commit SHA with a # vX.Y.Z comment, minimal per-job permissions, no apply on push, no long-lived cloud keys."
    - path: "**"
      instructions: "Escalate (do not just suggest) when: IAM trust/boundary/CI-role changes, wildcard actions or resources, secrets in diff, workflow permission widening or unpinned actions, deleted tests, terraform destroys, or edits under .github/workflows/guard.yml, .github/workflows/infra-aws.yml, .github/workflows/claude-review.yml, .github/actions, .github/scripts, .claude, CLAUDE.md, .coderabbit.yaml. State the concrete fix."
