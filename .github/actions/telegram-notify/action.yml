name: telegram-notify
# Composite steps have no continue-on-error, so notify.sh's failure is swallowed in the run line:
# an unreachable Telegram must never fail the caller's workflow.
description: "Send a Telegram message via the Ned bot (HTML; logs a warning instead of failing the caller)"
inputs:
  message:
    description: "HTML message (tags allowed: b, i, code, a)"
    required: true
  silent:
    description: disable notification sound
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        MESSAGE: ${{ inputs.message }}
        SILENT: ${{ inputs.silent }}
      run: bash "${{ github.action_path }}/notify.sh" || echo "::warning::telegram notify failed"
